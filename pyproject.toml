[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# test_server.py phải set ENV=LOCAL + sys.path TRƯỚC khi import app — E402 là chủ đích
"tests/test_server.py" = ["E402"]
# Script offline chạy độc lập: sys.path.insert TRƯỚC khi import src — E402 là chủ đích
"offline_training/*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
