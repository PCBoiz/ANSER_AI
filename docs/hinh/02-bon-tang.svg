<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="440" fill="#ffffff"/>
  <style>
    .tb  { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
    .t   { font-size: 14px; fill: #1a1a1a; }
    .ts  { font-size: 11.5px; fill: #5a5a5a; }
    .mono{ font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #2b2b2b; }
    .ar  { stroke: #5a6570; stroke-width: 1.8; fill: none; marker-end: url(#a); }
    .arx { stroke: #c0392b; stroke-width: 2; fill: none; marker-end: url(#ax); stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6570"/>
    </marker>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="16" y="26" class="tb" font-size="16">Bốn tầng, mũi tên chỉ đi xuống</text>
  <text x="16" y="46" class="ts">Lấy đúng theo tests/test_layering.py, file thi hành ranh giới này. Sổ tay và test mà khác nhau thì tin test.</text>

  <rect x="90" y="66" width="560" height="62" rx="6" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.4"/>
  <text x="112" y="92" class="tb">T4 · HTTP</text>
  <text x="112" y="112" class="mono">src/api/</text>
  <text x="370" y="92" class="ts">nhận request, xác thực, validate bằng pydantic, trả JSON</text>
  <text x="370" y="112" class="ts">không chứa logic nghiệp vụ, không có phép tính nào</text>

  <rect x="90" y="156" width="560" height="62" rx="6" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.4"/>
  <text x="112" y="182" class="tb">T3 · Điều phối</text>
  <text x="112" y="202" class="mono">src/agents/ · engine.py · knowledge.py</text>
  <text x="370" y="182" class="ts">gọi model, định tuyến, ép đầu ra khớp JSON Schema</text>
  <text x="370" y="202" class="ts">không tính tiền; prompt thuộc T1, không định nghĩa tại chỗ</text>

  <rect x="90" y="246" width="560" height="68" rx="6" fill="#dff0df" stroke="#5a9a5a" stroke-width="2"/>
  <text x="112" y="272" class="tb">T2 · Nghiệp vụ thuần</text>
  <text x="112" y="292" class="mono">src/core/</text>
  <text x="112" y="308" class="ts">inventory · receivables · vat_catalog · pricing · reporting</text>
  <text x="370" y="272" class="ts">mọi phép tính, mọi phép kiểm, mọi quyết định ghi dữ liệu</text>
  <text x="370" y="292" class="ts">không gọi LLM. Import tới agents/ hay api/ ở đây là sai tầng</text>

  <rect x="90" y="342" width="560" height="62" rx="6" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.4"/>
  <text x="112" y="368" class="tb">T1 · Nền</text>
  <text x="112" y="388" class="mono">config · serving · schemas · prompts · utils · chunking</text>
  <text x="370" y="368" class="ts">hằng số, dataclass, prompt, tiện ích thuần</text>
  <text x="370" y="388" class="ts">không biết gì về ba tầng trên</text>

  <path d="M70,128 L70,152" class="ar"/>
  <path d="M70,218 L70,242" class="ar"/>
  <path d="M70,314 L70,338" class="ar"/>

  <path d="M668,280 C 720,280 720,110 672,100" class="arx"/>
  <text x="690" y="196" class="ts" fill="#c0392b">cấm</text>
  <text x="690" y="212" class="ts" fill="#c0392b">đi lên</text>

  <rect x="90" y="418" width="820" height="0" fill="none"/>
  <text x="16" y="432" class="ts">T2 chỉ phụ thuộc T1, nên test nghiệp vụ chạy không cần GPU, không cần DB, không cần mạng. Đó cũng là chỗ gần như toàn bộ giá trị khách trả tiền nằm.</text>
</svg>
