<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="400" fill="#ffffff"/>
  <style>
    .tb  { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
    .t   { font-size: 13.5px; fill: #1a1a1a; }
    .ts  { font-size: 11.5px; fill: #5a5a5a; }
    .mono{ font-family: Consolas, "Courier New", monospace; font-size: 11.5px; fill: #2b2b2b; }
    .ar  { stroke: #5a6570; stroke-width: 1.8; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6570"/>
    </marker>
  </defs>

  <text x="16" y="26" class="tb" font-size="16">Luồng ra tiền: một file Excel thành danh sách phát hiện</text>
  <text x="16" y="46" class="ts">Không có model nào tham gia. Đây là luồng đã chạy trên 6 file MISA thật và ra kết quả khách kiểm tay được.</text>

  <rect x="16" y="72" width="150" height="80" rx="6" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.4"/>
  <text x="91" y="100" class="t" text-anchor="middle">Kế toán</text>
  <text x="91" y="120" class="ts" text-anchor="middle">tải lên .xlsx</text>
  <text x="91" y="136" class="ts" text-anchor="middle">xuất từ MISA</text>

  <rect x="206" y="72" width="170" height="80" rx="6" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.4"/>
  <text x="291" y="98" class="t" text-anchor="middle">tools.py</text>
  <text x="291" y="117" class="mono" text-anchor="middle">/tools/inventory-import</text>
  <text x="291" y="136" class="ts" text-anchor="middle" font-weight="600">file ở RAM, không ghi đĩa</text>

  <rect x="416" y="72" width="190" height="80" rx="6" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.4"/>
  <text x="511" y="98" class="t" text-anchor="middle">inventory_import.py</text>
  <text x="511" y="117" class="ts" text-anchor="middle">tìm header, map cột</text>
  <text x="511" y="136" class="ts" text-anchor="middle">ba lớp tự kiểm lệch cột</text>

  <rect x="646" y="72" width="140" height="80" rx="6" fill="#dff0df" stroke="#5a9a5a" stroke-width="1.8"/>
  <text x="716" y="98" class="t" text-anchor="middle">inventory.py</text>
  <text x="716" y="117" class="mono" text-anchor="middle">audit_inventory</text>
  <text x="716" y="136" class="ts" text-anchor="middle">bất đẳng thức số học</text>

  <rect x="826" y="72" width="98" height="80" rx="6" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.4"/>
  <text x="875" y="100" class="t" text-anchor="middle">findings</text>
  <text x="875" y="120" class="ts" text-anchor="middle">hình dạng</text>
  <text x="875" y="136" class="ts" text-anchor="middle">dùng chung</text>

  <path d="M166,112 L202,112" class="ar"/>
  <path d="M376,112 L412,112" class="ar"/>
  <path d="M606,112 L642,112" class="ar"/>
  <path d="M786,112 L822,112" class="ar"/>

  <!-- ba lop tu kiem -->
  <rect x="416" y="190" width="190" height="126" rx="6" fill="#fdfbf0" stroke="#c9b23f" stroke-width="1.4"/>
  <text x="511" y="212" class="t" text-anchor="middle" font-weight="600">Ba lớp tự kiểm</text>
  <text x="428" y="234" class="ts">1. đơn giá trong file phải khớp</text>
  <text x="440" y="249" class="ts">giá_trị / số_lượng tính lại</text>
  <text x="428" y="270" class="ts">2. dòng "Tổng cộng" của file</text>
  <text x="440" y="285" class="ts">phải khớp tổng cộng lại</text>
  <text x="428" y="306" class="ts">3. ĐK + Nhập − Xuất = CK</text>
  <path d="M511,152 L511,186" class="ar"/>

  <!-- bon truong finding -->
  <rect x="716" y="190" width="208" height="126" rx="6" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.4"/>
  <text x="820" y="212" class="t" text-anchor="middle" font-weight="600">Bốn trường bắt buộc</text>
  <text x="728" y="236" class="mono">title</text><text x="800" y="236" class="ts">cái gì sai, tiếng Việt thường</text>
  <text x="728" y="258" class="mono">evidence</text><text x="800" y="258" class="ts">số để mở MISA đối chiếu</text>
  <text x="728" y="280" class="mono">money_impact</text><text x="828" y="280" class="ts">hoặc None</text>
  <text x="728" y="302" class="mono">suggestion</text><text x="810" y="302" class="ts">việc cần làm tiếp</text>
  <path d="M875,152 L875,186" class="ar"/>

  <text x="16" y="348" class="ts" font-weight="600">Ô rỗng trả None, không trả 0.0.</text>
  <text x="196" y="348" class="ts">Nhầm "chưa biết" với "bằng không" là cách nhanh nhất để bịa ra một con số tài chính.</text>
  <text x="16" y="372" class="ts">Lần chạy thật đầu tiên bắt được đúng loại lỗi này ở chính parser: đọc đúng tên kho, kỳ, mã hàng, nhưng không map được cột số nào, ra 119 dòng</text>
  <text x="16" y="390" class="ts">toàn số 0. Và ok vẫn trả True, vì mismatches rỗng, mà mismatches rỗng chính vì không có cột nào để đối chiếu. Im lặng đúng lúc cần hét to nhất.</text>
</svg>
