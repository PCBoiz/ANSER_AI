<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="430" fill="#ffffff"/>
  <style>
    .t   { font-size: 14px; fill: #1a1a1a; }
    .tb  { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
    .ts  { font-size: 11.5px; fill: #5a5a5a; }
    .lbl { font-size: 11.5px; fill: #444; }
    .box { fill: #f7f8fa; stroke: #9aa3ad; stroke-width: 1.4; }
    .brain { fill: #e6f0fb; stroke: #4a7fb5; stroke-width: 1.8; }
    .det { fill: #dff0df; stroke: #5a9a5a; stroke-width: 1.6; }
    .ext { fill: #fdeedb; stroke: #c9913f; stroke-width: 1.6; }
    .db  { fill: #efeaf6; stroke: #8b76ad; stroke-width: 1.4; }
    .ar  { stroke: #5a6570; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .ard { stroke: #c9913f; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ao); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6570"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9913f"/>
    </marker>
  </defs>

  <text x="16" y="26" class="tb" font-size="16">Bối cảnh: ai gọi ai</text>

  <!-- Nguoi dung -->
  <rect x="16" y="150" width="120" height="66" rx="6" class="box"/>
  <text x="76" y="178" class="t" text-anchor="middle">Người dùng</text>
  <text x="76" y="196" class="ts" text-anchor="middle">kế toán, chủ DN</text>

  <!-- Body -->
  <rect x="186" y="128" width="166" height="110" rx="6" class="box"/>
  <text x="269" y="155" class="tb" text-anchor="middle">Body</text>
  <text x="269" y="174" class="ts" text-anchor="middle">Next.js</text>
  <text x="269" y="191" class="ts" text-anchor="middle">Dgsonn/ANSER-v2</text>
  <text x="269" y="214" class="ts" text-anchor="middle">giao diện, đăng nhập,</text>
  <text x="269" y="228" class="ts" text-anchor="middle">dữ liệu nghiệp vụ</text>

  <!-- Neon -->
  <rect x="186" y="286" width="166" height="56" rx="6" class="db"/>
  <text x="269" y="309" class="t" text-anchor="middle">Neon Postgres</text>
  <text x="269" y="327" class="ts" text-anchor="middle">dữ liệu của khách</text>

  <!-- n8n -->
  <rect x="186" y="34" width="166" height="56" rx="6" class="box"/>
  <text x="269" y="57" class="t" text-anchor="middle">n8n :5678</text>
  <text x="269" y="75" class="ts" text-anchor="middle">việc chạy theo lịch</text>

  <!-- Brain -->
  <rect x="412" y="34" width="298" height="300" rx="8" class="brain"/>
  <text x="561" y="60" class="tb" text-anchor="middle">Brain  (repo này)</text>
  <text x="561" y="78" class="ts" text-anchor="middle">FastAPI :8000 · PCBoiz/ANSER_AI</text>

  <rect x="432" y="96" width="258" height="50" rx="5" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.2"/>
  <text x="561" y="116" class="t" text-anchor="middle">Tầng API + định tuyến</text>
  <text x="561" y="134" class="ts" text-anchor="middle">/chat · /tools/* · /knowledge · /ocr</text>

  <rect x="432" y="160" width="258" height="62" rx="5" class="det"/>
  <text x="561" y="182" class="t" text-anchor="middle" font-weight="600">Lõi tất định — KHÔNG LLM</text>
  <text x="561" y="200" class="ts" text-anchor="middle">tồn kho · công nợ · VAT · báo giá</text>
  <text x="561" y="215" class="ts" text-anchor="middle">chạy được bằng CPU</text>

  <rect x="432" y="236" width="258" height="56" rx="5" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.2"/>
  <text x="561" y="257" class="t" text-anchor="middle">Kho tri thức (RAG)</text>
  <text x="561" y="275" class="ts" text-anchor="middle">bge-m3 + BM25 + ViRanker</text>

  <!-- Model -->
  <rect x="762" y="96" width="162" height="86" rx="6" class="box"/>
  <text x="843" y="122" class="t" text-anchor="middle">Model chạy local</text>
  <text x="843" y="141" class="ts" text-anchor="middle">vLLM + Qwen3-8B</text>
  <text x="843" y="157" class="ts" text-anchor="middle">VLM đọc hoá đơn</text>
  <text x="843" y="173" class="ts" text-anchor="middle">không ra khỏi máy</text>

  <!-- Nguon cong khai -->
  <rect x="762" y="246" width="162" height="88" rx="6" class="ext"/>
  <text x="843" y="270" class="t" text-anchor="middle">Nguồn công khai</text>
  <text x="843" y="289" class="ts" text-anchor="middle">giá dầu · tỷ giá</text>
  <text x="843" y="305" class="ts" text-anchor="middle">tìm kiếm web</text>
  <text x="843" y="323" class="ts" text-anchor="middle" font-weight="600">chỉ đọc, một chiều</text>

  <!-- Arrows -->
  <path d="M136,183 L182,183" class="ar"/>
  <path d="M269,238 L269,282" class="ar"/>
  <path d="M352,172 L408,140" class="ar"/>
  <text x="372" y="146" class="lbl">HTTP + token</text>
  <path d="M352,62 L408,80" class="ar"/>
  <text x="356" y="36" class="lbl">HTTP</text>
  <path d="M690,130 L758,130" class="ar"/>
  <path d="M690,268 L758,282" class="ard"/>
  <text x="664" y="312" class="lbl" fill="#a9772a" text-anchor="middle">không kèm dữ liệu khách</text>

  <text x="16" y="372" class="ts">Ranh giới R2 nằm ở đúng một mũi tên: nét đứt đi ra nguồn công khai. Mọi thứ khác ở lại trong hạ tầng của khách.</text>
  <text x="16" y="394" class="ts">Body chạy được khi Brain tắt; lúc đó các tính năng AI hiện trạng "chưa cấu hình", phần còn lại dùng bình thường.</text>
  <text x="16" y="416" class="ts">Bạn được sửa Brain. Body thì không: chỉ được đề xuất thay đổi bằng văn bản.</text>
</svg>
